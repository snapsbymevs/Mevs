<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1"><title>MEVS — Photography</title><style>
:root{color-scheme:light;--bg:#f6f5f1;--fg:#22221f;--muted:#77766f;--line:#d8d6cf;--panel:#e9e7e0}body.dark{color-scheme:dark;--bg:#171817;--fg:#eeeae2;--muted:#a5a29a;--line:#3a3a36;--panel:#292a27}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;transition:background .25s,color .25s}header{display:flex;justify-content:space-between;align-items:center;padding:25px clamp(22px,6vw,90px);border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:750;letter-spacing:.24em}.right{display:flex;gap:22px;align-items:center}button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:40px;padding:10px 16px;cursor:pointer;font-size:13px}a{color:inherit;text-decoration:none}.link{font-size:13px}.intro{text-align:center;padding:85px 18px 75px}.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}.intro h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(48px,9vw,100px);line-height:1.06;margin:20px 0}.intro p{font-size:15px;line-height:1.7;color:var(--muted);max-width:440px;margin:auto}.gallery{max-width:980px;margin:auto;padding:0 18px}.photo{margin:0 auto 100px;max-width:760px}.photo img{width:100%;height:auto;display:block;background:var(--panel)}.photo figcaption{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding-top:14px}.photo:nth-child(3n+2){max-width:590px}.photo:nth-child(3n+3){max-width:850px}.empty{text-align:center;padding:80px 15px;border:1px solid var(--line);color:var(--muted)}footer{padding:65px 20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}footer a{text-decoration:underline}.demo{font-size:12px;color:var(--muted);text-align:center;margin:-34px 0 65px}.sample{aspect-ratio:3/4;position:relative;overflow:hidden;background:linear-gradient(150deg,#c5c3b8,#595b58 65%,#292c2b)}.sample.wide{aspect-ratio:3/2;background:linear-gradient(160deg,#b3b2ac 5%,#797b77 50%,#2d3231 51%,#171a1a)}.sample.square{aspect-ratio:1/1;background:linear-gradient(135deg,#a9a9a0,#444743 55%,#191c1a)}.sample:after{content:'PREVIEW · YOUR PIXELFED PHOTOGRAPH';position:absolute;bottom:20px;left:20px;color:#f4f1ea;font-size:10px;letter-spacing:.17em}.sample:before{content:'';position:absolute;width:25%;height:70%;bottom:0;left:40%;background:linear-gradient(#292d2d,#111);clip-path:polygon(35% 0,65% 0,83% 17%,72% 52%,90% 100%,10% 100%,28% 52%,17% 17%);opacity:.65}.sample.wide:before{height:60%;left:62%;width:12%}@media(max-width:600px){header{padding:20px}.right{gap:12px}.intro{padding:72px 20px}.photo{margin-bottom:75px}.photo figcaption{font-size:11px}}


/* Dedicated book mode: a fixed, opaque, three-row viewport. */
.photo a{cursor:zoom-in}
#return-book[hidden]{display:none}
.viewer{position:fixed;inset:0;z-index:1000;background:#090a0b;color:#fff;display:none;flex-direction:column;overflow:hidden;isolation:isolate;--paper:#eae7df;--edge:#b4aea4;--inner:#f7f5ee;--thumb:74px}
.viewer.open{display:flex}body.book-active{overflow:hidden}
.viewer button{color:#f5f5f5;background:#242527;border:1px solid #525357;border-radius:24px;min-height:34px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.viewer button:focus-visible,.viewer input:focus-visible{outline:2px solid white;outline-offset:2px}
.book-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:7px;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;background:#111214;z-index:6;min-height:48px}
.book-toolbar .book-count{font-size:12px;letter-spacing:.08em;white-space:nowrap;min-width:58px;text-align:center}
.book-toolbar .book-tools{display:flex;gap:6px;align-items:center}
.book-toolbar button{padding:6px 10px}
.book-toolbar #book-settings-toggle{font-size:18px;min-width:36px}
.book-settings{position:absolute;top:calc(env(safe-area-inset-top) + 52px);right:10px;z-index:12;background:#202123;border:1px solid #56585c;border-radius:12px;box-shadow:0 12px 32px #0009;padding:12px;display:none;gap:10px;flex-direction:column;min-width:205px}
.book-settings.open{display:flex}.book-settings label{font-size:12px;color:#ddd;display:flex;align-items:center;justify-content:space-between;gap:12px}
.book-settings input{accent-color:#ddd;width:100px}.book-settings .settings-row{display:flex;gap:8px}
.book-settings .settings-row button{flex:1}
.book-area{flex:1 1 0;min-height:0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:7px 13px 12px;overflow:hidden;perspective:1800px}
.book-stage{position:relative;width:100%;height:100%;max-width:1600px;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1800px;isolation:isolate}
.book-page,.turn-page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--edge);padding:clamp(5px,1.3vmin,14px);box-shadow:inset 0 0 0 2px var(--inner),4px 4px 0 var(--edge),7px 7px 0 #333;overflow:hidden}
.book-page:after,.turn-page:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0002,transparent 7%,transparent 94%,#0002)}
.book-page img,.turn-page img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;box-shadow:0 1px 5px #0002}
.viewer.fill-image .book-page img,.viewer.fill-image .turn-page img{width:100%;height:100%;object-fit:cover}
.viewer.paper-grey{--paper:#989995;--edge:#747571;--inner:#b2b3ad}.viewer.paper-dark{--paper:#303236;--edge:#54575c;--inner:#44464a}
.turn-page{z-index:3;display:none;backface-visibility:hidden;transform-style:preserve-3d;will-change:transform}
.turn-page.turn-forward{display:flex;transform-origin:left center;animation:page-forward .7s ease-in-out forwards}.turn-page.turn-back{display:flex;transform-origin:right center;animation:page-back .7s ease-in-out forwards}
@keyframes page-forward{0%{transform:rotateY(0);filter:brightness(1)}50%{filter:brightness(.6)}100%{transform:rotateY(-179deg);filter:brightness(.9)}}
@keyframes page-back{0%{transform:rotateY(0);filter:brightness(1)}50%{filter:brightness(.6)}100%{transform:rotateY(179deg);filter:brightness(.9)}}
.book-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;opacity:.78}.book-arrow.prev{left:16px}.book-arrow.next{right:16px}
.book-selector{flex:0 0 auto;height:clamp(102px,19dvh,160px);background:#151617;border-top:1px solid #333;display:flex;flex-direction:column;gap:5px;padding:5px 9px calc(env(safe-area-inset-bottom) + 5px);min-height:0;z-index:6}
.viewer.selector-hidden .book-selector{display:none}.selector-top{display:flex;align-items:center;gap:10px;flex:0 0 auto}.selector-top input{flex:1;min-width:0;accent-color:white;height:14px}
.book-film{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#777 #222;padding:2px 0;overscroll-behavior-x:contain}
.book-film button{position:relative;flex:0 0 var(--thumb);width:var(--thumb);height:100%;min-height:0;min-width:0;padding:0;border-radius:3px;border:2px solid transparent;overflow:hidden;background:#292a2c}
.book-film button.selected{border-color:white}.book-film img{width:100%;height:100%;object-fit:cover;display:block}.book-film small{position:absolute;right:2px;bottom:2px;background:#000b;padding:2px 3px;font-size:10px}
@media(orientation:landscape) and (max-height:650px){.book-toolbar{min-height:36px;padding:3px 9px}.book-toolbar button{min-height:29px;padding:3px 9px}.book-selector{height:clamp(67px,20dvh,94px);padding:3px 8px calc(env(safe-area-inset-bottom) + 2px);gap:2px}.book-area{padding:3px 12px 8px}.book-page,.turn-page{padding:5px}.book-settings{top:43px}.selector-top{height:15px}.selector-top input{height:12px}}
@media(max-width:600px) and (orientation:portrait){.book-toolbar{gap:4px;padding-left:7px;padding-right:7px}.book-toolbar button{padding:5px 8px}.book-selector{height:clamp(126px,21dvh,180px)}.book-area{padding:7px 10px 11px}}
@media(hover:none){.book-arrow{display:none}}
@media(prefers-reduced-motion:reduce){.turn-page.turn-forward,.turn-page.turn-back{display:none;animation:none}}
</style></head><body><header><a class="logo" href="#top">MEVS</a><div class="right"><a class="link" href="https://pixelfed.social/mevs" target="_blank" rel="noopener">Pixelfed ↗</a><button id="return-book" type="button" hidden>◫ Book view</button><button id="theme" aria-label="Toggle dark mode">◐ Theme</button></div></header><main id="top"><section class="intro"><div class="eyebrow">Photography / An ongoing collection</div><h1>Life, observed.</h1><p>Moments in passing. A visual journal of ordinary scenes, unexpected details, and the spaces between.</p></section><div id="demo" class="demo">Design preview — sample compositions, not your photographs</div><div class="gallery" id="gallery"><figure class="photo"><div class="sample"></div><figcaption><span>001 — An ordinary moment</span><span>Photography</span></figcaption></figure><figure class="photo"><div class="sample wide"></div><figcaption><span>002 — In passing</span><span>Photography</span></figcaption></figure><figure class="photo"><div class="sample square"></div><figcaption><span>003 — Between places</span><span>Photography</span></figcaption></figure></div></main><footer>MEVS · PHOTOGRAPHY<br><br><a href="https://pixelfed.social/mevs">Follow on Pixelfed ↗</a></footer><section class="viewer" id="viewer" aria-label="MEVS photobook" tabindex="-1">
<div class="book-toolbar"><button id="viewer-close">☰ Scroll</button><span id="viewer-count" class="book-count">—</span><div class="book-tools"><button id="viewer-random">⤨ Random</button><button id="viewer-strip-toggle" aria-expanded="true">▦ Hide</button><button id="book-settings-toggle" aria-expanded="false" aria-label="Viewer settings">⚙</button><button id="viewer-full" aria-label="Fullscreen">⛶</button></div></div>
<div id="book-settings" class="book-settings"><div class="settings-row"><button id="paper-toggle">◧ Paper</button><button id="fit-toggle">⛶ Fit</button></div><button id="viewer-shuffle">⇄ Shuffle thumbnails</button><label>Thumbnail size <input id="thumb-size" type="range" min="48" max="170" value="74"></label></div>
<div class="book-area" id="book-area"><div class="book-stage" id="book-stage"><div class="book-page"><img id="viewer-image" alt=""></div><div class="turn-page" id="turn-page" aria-hidden="true"><img id="turn-image" alt=""></div></div><button id="viewer-prev" class="book-arrow prev" aria-label="Previous photograph">‹</button><button id="viewer-next" class="book-arrow next" aria-label="Next photograph">›</button></div>
<div class="book-selector" id="viewer-strip"><div class="selector-top"><input id="viewer-range" type="range" min="1" max="1" value="1" aria-label="Jump to photo"></div><div class="book-film" id="viewer-film" aria-label="Select photograph"></div></div>
</section><script>
const themeButton=document.getElementById('theme');function theme(d){document.body.classList.toggle('dark',d);themeButton.textContent=d?'☀ Light':'◐ Dark';localStorage.setItem('mevs-theme',d?'dark':'light')}theme(localStorage.getItem('mevs-theme')!=='light');themeButton.onclick=()=>theme(!document.body.classList.contains('dark'));
const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),viewerImage=document.getElementById('viewer-image'),counter=document.getElementById('viewer-count'),range=document.getElementById('viewer-range'),film=document.getElementById('viewer-film'),settings=document.getElementById('book-settings');
let photos=[],current=0,shuffled=false,flipTimer=null,previousFocus=null;
const turnPage=document.getElementById('turn-page'),turnImage=document.getElementById('turn-image');
function render(items){photos=items;gallery.replaceChildren();items.forEach((p,i)=>{let fig=document.createElement('figure');fig.className='photo';let a=document.createElement('a');a.href=p.post_url||'https://pixelfed.social/mevs';a.addEventListener('click',e=>{e.preventDefault();openViewer(i)});let img=document.createElement('img');img.src=p.image;img.alt=p.alt||'Photograph by MEVS';img.loading=i<2?'eager':'lazy';a.append(img);let cap=document.createElement('figcaption');cap.textContent=String(items.length-i).padStart(3,'0')+(p.caption?' — '+p.caption:'');fig.append(a,cap);gallery.append(fig)});document.getElementById('demo').hidden=true;range.max=items.length;buildSelector();openViewer(0)}
function buildSelector(){film.replaceChildren();let order=photos.map((_,i)=>i);if(shuffled){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}order.forEach(i=>{let b=document.createElement('button');b.dataset.index=i;b.type='button';b.setAttribute('aria-label','Photo '+(photos.length-i));let im=document.createElement('img');im.src=photos[i].image;im.alt='';im.loading='lazy';let n=document.createElement('small');n.textContent=photos.length-i;b.append(im,n);b.onclick=()=>showPhoto(i);film.append(b)});updateSelection()}
function updateSelection(){film.querySelectorAll('button').forEach(b=>{let on=Number(b.dataset.index)===current;b.classList.toggle('selected',on);b.setAttribute('aria-current',String(on))})}
function centerSelection(){film.querySelector('button.selected')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function showPhoto(n){if(!photos.length)return;const old=current,next=(n+photos.length)%photos.length,prior=photos[old];clearTimeout(flipTimer);turnPage.classList.remove('turn-forward','turn-back');turnPage.style.display='none';current=next;let p=photos[current];viewerImage.src=p.image;viewerImage.alt=p.alt||'Photograph by MEVS';counter.textContent=String(photos.length-current).padStart(2,'0')+' / '+photos.length;range.value=photos.length-current;updateSelection();if(!viewer.classList.contains('selector-hidden'))centerSelection();if(viewer.classList.contains('open')&&old!==next&&!matchMedia('(prefers-reduced-motion:reduce)').matches){turnImage.src=prior.image;turnPage.style.display='flex';void turnPage.offsetWidth;turnPage.classList.add(n>old?'turn-forward':'turn-back');flipTimer=setTimeout(()=>{turnPage.classList.remove('turn-forward','turn-back');turnPage.style.display='none'},730)}}
function openViewer(n){previousFocus=document.activeElement;viewer.classList.add('open');document.body.classList.add('book-active');document.getElementById('return-book').hidden=true;showPhoto(n);viewer.focus()}
function closeViewer(){viewer.classList.remove('open');settings.classList.remove('open');document.body.classList.remove('book-active');document.getElementById('return-book').hidden=false;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});window.scrollTo({top:0,behavior:'instant'});previousFocus?.focus()}
document.getElementById('return-book').onclick=()=>openViewer(current);document.getElementById('viewer-close').onclick=closeViewer;
document.getElementById('viewer-prev').onclick=()=>showPhoto(current-1);document.getElementById('viewer-next').onclick=()=>showPhoto(current+1);
document.getElementById('viewer-random').onclick=()=>{if(photos.length<2)return;let n=Math.floor(Math.random()*(photos.length-1));if(n>=current)n++;showPhoto(n)};
document.getElementById('viewer-strip-toggle').onclick=e=>{let hidden=viewer.classList.toggle('selector-hidden');e.currentTarget.textContent=hidden?'▦ Photos':'▦ Hide';e.currentTarget.setAttribute('aria-expanded',String(!hidden));if(!hidden)centerSelection()};
document.getElementById('book-settings-toggle').onclick=e=>{let opened=settings.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(opened))};
document.getElementById('viewer-shuffle').onclick=e=>{shuffled=!shuffled;e.currentTarget.textContent=shuffled?'↕ Restore order':'⇄ Shuffle thumbnails';buildSelector();centerSelection()};
document.getElementById('thumb-size').oninput=e=>viewer.style.setProperty('--thumb',e.target.value+'px');
range.oninput=e=>showPhoto(photos.length-Number(e.target.value));
const paperModes=['light','grey','dark'];let paperMode=localStorage.getItem('mevs-paper')||'light';function setPaper(m){paperMode=paperModes.includes(m)?m:'light';viewer.classList.toggle('paper-grey',paperMode==='grey');viewer.classList.toggle('paper-dark',paperMode==='dark');document.getElementById('paper-toggle').textContent='◧ '+({light:'White',grey:'Grey',dark:'Dark'}[paperMode]);localStorage.setItem('mevs-paper',paperMode)}setPaper(paperMode);document.getElementById('paper-toggle').onclick=()=>setPaper(paperModes[(paperModes.indexOf(paperMode)+1)%3]);
let fillImage=localStorage.getItem('mevs-fit')==='fill';function setFit(v){fillImage=v;viewer.classList.toggle('fill-image',v);document.getElementById('fit-toggle').textContent=v?'▣ Fill':'⛶ Fit';localStorage.setItem('mevs-fit',v?'fill':'fit')}setFit(fillImage);document.getElementById('fit-toggle').onclick=()=>setFit(!fillImage);
document.getElementById('viewer-full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(viewer.requestFullscreen)await viewer.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')showPhoto(current-1);if(e.key==='ArrowRight')showPhoto(current+1)});
let x=0,y=0;const area=document.getElementById('book-area');area.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});area.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2)showPhoto(current+(dx<0?1:-1))},{passive:true});
fetch('./photos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No photos yet');return r.json()}).then(data=>{if(Array.isArray(data)&&data.length)render(data)}).catch(()=>{});
</script></body></html>
