<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1"><title>MEVS - 📸</title><style>
:root{color-scheme:light;--bg:#f6f5f1;--fg:#22221f;--muted:#77766f;--line:#d8d6cf;--panel:#e9e7e0}body.dark{color-scheme:dark;--bg:#171817;--fg:#eeeae2;--muted:#a5a29a;--line:#3a3a36;--panel:#292a27}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;transition:background .25s,color .25s}header{display:flex;justify-content:space-between;align-items:center;padding:25px clamp(22px,6vw,90px);border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:750;letter-spacing:.24em}.right{display:flex;gap:22px;align-items:center}button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:40px;padding:10px 16px;cursor:pointer;font-size:13px}a{color:inherit;text-decoration:none}.link{font-size:13px}.intro{text-align:center;padding:85px 18px 75px}.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}.intro h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(48px,9vw,100px);line-height:1.06;margin:20px 0}.intro p{font-size:15px;line-height:1.7;color:var(--muted);max-width:440px;margin:auto}.gallery{max-width:980px;margin:auto;padding:0 18px}.photo{margin:0 auto 100px;max-width:760px}.photo img{width:100%;height:auto;display:block;background:var(--panel)}.photo figcaption{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding-top:14px}.photo:nth-child(3n+2){max-width:590px}.photo:nth-child(3n+3){max-width:850px}.empty{text-align:center;padding:80px 15px;border:1px solid var(--line);color:var(--muted)}footer{padding:65px 20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}footer a{text-decoration:underline}.demo{font-size:12px;color:var(--muted);text-align:center;margin:-34px 0 65px}.sample{aspect-ratio:3/4;position:relative;overflow:hidden;background:linear-gradient(150deg,#c5c3b8,#595b58 65%,#292c2b)}.sample.wide{aspect-ratio:3/2;background:linear-gradient(160deg,#b3b2ac 5%,#797b77 50%,#2d3231 51%,#171a1a)}.sample.square{aspect-ratio:1/1;background:linear-gradient(135deg,#a9a9a0,#444743 55%,#191c1a)}.sample:after{content:'PREVIEW · YOUR PIXELFED PHOTOGRAPH';position:absolute;bottom:20px;left:20px;color:#f4f1ea;font-size:10px;letter-spacing:.17em}.sample:before{content:'';position:absolute;width:25%;height:70%;bottom:0;left:40%;background:linear-gradient(#292d2d,#111);clip-path:polygon(35% 0,65% 0,83% 17%,72% 52%,90% 100%,10% 100%,28% 52%,17% 17%);opacity:.65}.sample.wide:before{height:60%;left:62%;width:12%}@media(max-width:600px){header{padding:20px}.right{gap:12px}.intro{padding:72px 20px}.photo{margin-bottom:75px}.photo figcaption{font-size:11px}}

/* Immersive photo viewer */
.photo a{cursor:zoom-in}.viewer{position:fixed;inset:0;z-index:1000;background:#080808;color:white;display:none;align-items:center;justify-content:center;touch-action:pan-y}.viewer.open{display:flex}.viewer img{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:pan-y}.viewer-controls{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;background:linear-gradient(#0009,transparent);transition:opacity .2s}.viewer button{background:#181818bb;border:1px solid #ffffff44;color:white;min-width:44px;min-height:44px;padding:10px}.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:25px}.viewer-prev{left:12px}.viewer-next{right:12px}.viewer-count{font-size:12px;letter-spacing:.1em}.viewer.hide-ui .viewer-controls,.viewer.hide-ui .viewer-nav{opacity:0;pointer-events:none}.viewer-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);font-size:11px;color:#ccc;pointer-events:none}.viewer.hide-ui .viewer-hint{display:none}@media(hover:none){.viewer-nav{display:none}}

.viewer-strip{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000e 24%);padding:18px 12px calc(env(safe-area-inset-bottom) + 12px);display:none;flex-direction:column;gap:10px;z-index:3}.viewer.strip-open .viewer-strip{display:flex}.viewer-film{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#888 #222;padding:3px 2px;overscroll-behavior-x:contain}.viewer-film button{flex:0 0 65px;width:65px;height:65px;border:2px solid transparent;padding:0;border-radius:3px;overflow:hidden;min-width:0;min-height:0;position:relative;background:#222}.viewer-film button.selected{border-color:white}.viewer-film img{width:100%;height:100%;object-fit:cover;display:block}.viewer-film small{position:absolute;right:2px;bottom:2px;background:#000a;color:white;padding:1px 3px;font-size:10px}.viewer-range{width:100%;accent-color:#fff;touch-action:pan-x}.viewer.strip-open .viewer-hint{display:none}.viewer.hide-ui .viewer-strip{display:none}.viewer-strip-toggle{font-size:12px;white-space:nowrap}.viewer-controls{gap:8px}.viewer-count{flex:1;text-align:center}
</style></head><body><header><a class="logo" href="#top">MEVS</a><div class="right"><a class="link" href="https://pixelfed.social/mevs" target="_blank" rel="noopener">Pixelfed ↗</a><button id="theme" aria-label="Toggle dark mode">◐ Theme</button></div></header><main id="top"><section class="intro"><div class="eyebrow">An ongoing collection of</div><h1>Life, observed.</h1><p>📸.</p></section><div id="demo" class="demo">Design preview — sample compositions, not your photographs</div><div class="gallery" id="gallery"><figure class="photo"><div class="sample"></div><figcaption><span>001 — An ordinary moment</span><span>Photography</span></figcaption></figure><figure class="photo"><div class="sample wide"></div><figcaption><span>002 — In passing</span><span>Photography</span></figcaption></figure><figure class="photo"><div class="sample square"></div><figcaption><span>003 — Between places</span><span>Photography</span></figcaption></figure></div></main><footer>MEVS · 📸<br><br><a href="https://pixelfed.social/mevs">Follow on Pixelfed ↗</a></footer><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Fullscreen photo viewer" tabindex="-1"><img id="viewer-image" alt=""><div class="viewer-controls"><button id="viewer-close" aria-label="Close viewer">✕</button><span id="viewer-count" class="viewer-count"></span><button id="viewer-strip-toggle" class="viewer-strip-toggle" aria-label="Toggle photo selector" aria-expanded="false">▦ Photos</button><button id="viewer-full" aria-label="Toggle fullscreen">⛶</button></div><button class="viewer-nav viewer-prev" id="viewer-prev" aria-label="Previous photograph">‹</button><button class="viewer-nav viewer-next" id="viewer-next" aria-label="Next photograph">›</button><span class="viewer-hint">Swipe to browse · Rotate for landscape</span><div class="viewer-strip" id="viewer-strip"><input id="viewer-range" class="viewer-range" type="range" min="1" max="1" value="1" aria-label="Select photo by number"><div id="viewer-film" class="viewer-film" aria-label="All photos"></div></div></div><script>
const button=document.getElementById('theme');function theme(d){document.body.classList.toggle('dark',d);button.textContent=d?'☀ Light':'◐ Dark';localStorage.setItem('mevs-theme',d?'dark':'light')}theme(localStorage.getItem('mevs-theme')==='dark'||(!localStorage.getItem('mevs-theme')&&matchMedia('(prefers-color-scheme: dark)').matches));button.onclick=()=>theme(!document.body.classList.contains('dark'));
const gallery=document.getElementById('gallery');let photos=[];function render(items){photos=items;gallery.replaceChildren();for(let i=0;i<items.length;i++){let p=items[i],fig=document.createElement('figure');fig.className='photo';let a=document.createElement('a');a.href=p.post_url||'https://pixelfed.social/mevs';a.target='_blank';a.rel='noopener';a.addEventListener('click',e=>{e.preventDefault();openViewer(i)});let img=document.createElement('img');img.src=p.image;img.alt=p.alt||'Photograph by MEVS';img.loading=i<2?'eager':'lazy';a.append(img);let cap=document.createElement('figcaption'),left=document.createElement('span'),right=document.createElement('span');left.textContent=String(items.length-i).padStart(3,'0')+(p.caption?' — '+p.caption:'');right.textContent=p.date||'MEVS';cap.append(left,right);fig.append(a,cap);gallery.append(fig)}document.getElementById('demo').hidden=true}fetch('./photos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(Array.isArray(data)&&data.length)render(data)}).catch(()=>{});

const viewer=document.getElementById('viewer'),viewerImage=document.getElementById('viewer-image'),counter=document.getElementById('viewer-count');let current=0,previousFocus=null;const viewerRange=document.getElementById('viewer-range'),viewerFilm=document.getElementById('viewer-film'),stripToggle=document.getElementById('viewer-strip-toggle');function buildSelector(){viewerFilm.replaceChildren();viewerRange.max=photos.length;photos.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','View photograph '+(photos.length-i));const im=document.createElement('img');im.src=p.image;im.alt='';im.loading='lazy';const num=document.createElement('small');num.textContent=photos.length-i;b.append(im,num);b.onclick=()=>showPhoto(i);viewerFilm.append(b)})}viewerRange.addEventListener('input',()=>showPhoto(photos.length-Number(viewerRange.value)));stripToggle.onclick=()=>{const opened=viewer.classList.toggle('strip-open');stripToggle.setAttribute('aria-expanded',String(opened));stripToggle.textContent=opened?'▦ Hide':'▦ Photos';if(opened)viewerFilm.children[current]?.scrollIntoView({block:'nearest',inline:'center'})};
function showPhoto(n){if(!photos.length)return;current=(n+photos.length)%photos.length;const p=photos[current];viewerImage.src=p.image;viewerImage.alt=p.alt||'Photograph by MEVS';counter.textContent=String(photos.length-current).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');viewerRange.value=photos.length-current;viewerFilm.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('selected',i===current);b.setAttribute('aria-current',i===current?'true':'false')});if(viewer.classList.contains('strip-open'))viewerFilm.children[current]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});viewer.classList.remove('hide-ui')}
function openViewer(n){previousFocus=document.activeElement;buildSelector();showPhoto(n);viewer.classList.add('open');document.body.style.overflow='hidden';viewer.focus()}
function closeViewer(){viewer.classList.remove('open','strip-open');stripToggle.textContent='▦ Photos';stripToggle.setAttribute('aria-expanded','false');document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(previousFocus)previousFocus.focus()}
document.getElementById('viewer-close').onclick=closeViewer;document.getElementById('viewer-prev').onclick=()=>showPhoto(current-1);document.getElementById('viewer-next').onclick=()=>showPhoto(current+1);
document.getElementById('viewer-full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(viewer.requestFullscreen)await viewer.requestFullscreen()}catch(e){}};
viewerImage.addEventListener('click',()=>viewer.classList.toggle('hide-ui'));
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')showPhoto(current-1);if(e.key==='ArrowRight')showPhoto(current+1)});
let startX=0,startY=0;viewer.addEventListener('touchstart',e=>{if(e.target.closest('.viewer-strip'))return;if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});viewer.addEventListener('touchend',e=>{if(e.target.closest('.viewer-strip'))return;if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)showPhoto(current+(dx<0?1:-1));else if(dy>130&&Math.abs(dy)>Math.abs(dx)*1.5)closeViewer()},{passive:true});
</script></body></html>
