<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1"><title>MEVS — Photography</title><style>
:root{color-scheme:light;--bg:#f6f5f1;--fg:#22221f;--muted:#77766f;--line:#d8d6cf;--panel:#e9e7e0}body.dark{color-scheme:dark;--bg:#171817;--fg:#eeeae2;--muted:#a5a29a;--line:#3a3a36;--panel:#292a27}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;transition:background .25s,color .25s}header{display:flex;justify-content:space-between;align-items:center;padding:25px clamp(22px,6vw,90px);border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:750;letter-spacing:.24em}.right{display:flex;gap:22px;align-items:center}button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:40px;padding:10px 16px;cursor:pointer;font-size:13px}a{color:inherit;text-decoration:none}.link{font-size:13px}.intro{text-align:center;padding:85px 18px 75px}.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}.intro h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(48px,9vw,100px);line-height:1.06;margin:20px 0}.intro p{font-size:15px;line-height:1.7;color:var(--muted);max-width:440px;margin:auto}.gallery{max-width:980px;margin:auto;padding:0 18px}.photo{margin:0 auto 100px;max-width:760px}.photo img{width:100%;height:auto;display:block;background:var(--panel)}.photo figcaption{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding-top:14px}.photo:nth-child(3n+2){max-width:590px}.photo:nth-child(3n+3){max-width:850px}.empty{text-align:center;padding:80px 15px;border:1px solid var(--line);color:var(--muted)}footer{padding:65px 20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}footer a{text-decoration:underline}.demo{font-size:12px;color:var(--muted);text-align:center;margin:-34px 0 65px}.sample{aspect-ratio:3/4;position:relative;overflow:hidden;background:linear-gradient(150deg,#c5c3b8,#595b58 65%,#292c2b)}.sample.wide{aspect-ratio:3/2;background:linear-gradient(160deg,#b3b2ac 5%,#797b77 50%,#2d3231 51%,#171a1a)}.sample.square{aspect-ratio:1/1;background:linear-gradient(135deg,#a9a9a0,#444743 55%,#191c1a)}.sample:after{content:'PREVIEW · YOUR PIXELFED PHOTOGRAPH';position:absolute;bottom:20px;left:20px;color:#f4f1ea;font-size:10px;letter-spacing:.17em}.sample:before{content:'';position:absolute;width:25%;height:70%;bottom:0;left:40%;background:linear-gradient(#292d2d,#111);clip-path:polygon(35% 0,65% 0,83% 17%,72% 52%,90% 100%,10% 100%,28% 52%,17% 17%);opacity:.65}.sample.wide:before{height:60%;left:62%;width:12%}@media(max-width:600px){header{padding:20px}.right{gap:12px}.intro{padding:72px 20px}.photo{margin-bottom:75px}.photo figcaption{font-size:11px}}


/* MEVS Gallery — immersive, borderless photo viewing */
.photo a{cursor:zoom-in}#return-book[hidden]{display:none}
.viewer{position:fixed;inset:0;z-index:1000;background:#080808;color:#f5f5f5;display:none;flex-direction:column;overflow:hidden;isolation:isolate;--thumb:78px}
.viewer.open{display:flex}body.book-active{overflow:hidden}
.viewer.light-view{background:#f7f7f5;color:#171717}
.viewer button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;border-radius:9px;padding:8px;touch-action:manipulation}
.viewer button:focus-visible,.viewer input:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.view-toolbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 5px) 12px 4px;min-height:48px}
.view-brand{font-size:13px;font-weight:700;letter-spacing:.2em}.view-count{font-size:12px;letter-spacing:.11em;color:#a8a8a8;font-variant-numeric:tabular-nums}
.view-actions{display:flex;align-items:center;gap:4px}.view-actions button{font-size:12px}.view-actions button.icon-btn{font-size:19px;width:36px;height:36px;display:grid;place-items:center}
.view-area{flex:1 1 0;min-height:0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px 12px 7px;touch-action:pan-y}
#viewer-image{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .16s ease,transform .2s ease}
#viewer-image.changing{opacity:.35;transform:translateX(var(--shift,0px)) scale(.99)}
.viewer.fill-image #viewer-image{width:100%;height:100%;object-fit:cover}
.view-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:#1119!important;color:white!important;border-radius:50%!important;width:38px;height:38px;font-size:26px!important;padding:0!important;display:grid;place-items:center}
.view-arrow.prev{left:15px}.view-arrow.next{right:15px}
.selector-toggle{flex:none;display:flex;align-items:center;justify-content:center;width:100%;height:28px!important;min-height:28px;padding:0!important;border-radius:0!important;color:#bcbcbc!important;position:relative}
.selector-toggle:before,.selector-toggle:after{content:"";height:1px;background:#353535;flex:1;max-width:130px}.selector-toggle .toggle-label{font-size:11px;letter-spacing:.09em;padding:0 12px;display:flex;align-items:center;gap:7px}
.selector-toggle .chevron{font-size:17px;display:inline-block;transition:transform .2s}.viewer.selector-hidden .chevron{transform:rotate(180deg)}
.view-selector{flex:none;height:clamp(95px,18dvh,145px);display:flex;flex-direction:column;min-height:0;padding:0 12px calc(env(safe-area-inset-bottom) + 8px)}.viewer.selector-hidden .view-selector{display:none}
.view-film{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;flex:1;min-height:0;padding:4px 0 6px;scrollbar-width:thin;scrollbar-color:#777 transparent;overscroll-behavior-x:contain}
.view-film button{flex:0 0 var(--thumb);width:var(--thumb);height:100%;position:relative;padding:0;border:2px solid transparent;border-radius:2px;overflow:hidden;background:#252525}
.view-film button.selected{border-color:#f5f5f5}.view-film img{width:100%;height:100%;object-fit:cover;display:block}.view-film small{position:absolute;bottom:2px;right:2px;background:#000a;color:#fff;padding:2px 4px;font-size:10px}
.view-settings{position:absolute;top:calc(env(safe-area-inset-top) + 48px);right:10px;z-index:20;background:#242424;color:#f4f4f4;border:1px solid #4b4b4b;box-shadow:0 12px 35px #0009;border-radius:12px;padding:13px;display:none;flex-direction:column;gap:10px;min-width:220px;font-size:13px}
.view-settings.open{display:flex}.view-settings label{display:flex;align-items:center;justify-content:space-between;gap:8px}.view-settings input{width:95px;accent-color:#eee}.view-settings button{background:#393939;border:1px solid #555;text-align:left;padding:9px}
.viewer.light-view .view-count{color:#666}.viewer.light-view .selector-toggle{color:#555!important}.viewer.light-view .selector-toggle:before,.viewer.light-view .selector-toggle:after{background:#c5c5c5}.viewer.light-view .view-film button.selected{border-color:#111}
@media(hover:none){.view-arrow{display:none}}
@media(orientation:landscape) and (max-height:650px){.view-toolbar{min-height:34px;padding:2px 12px}.view-actions button.icon-btn{width:31px;height:30px}.view-area{padding:0 8px}.view-selector{height:clamp(61px,18dvh,85px);padding-bottom:calc(env(safe-area-inset-bottom) + 3px)}.selector-toggle{height:20px!important;min-height:20px}.view-settings{top:37px}}
@media(max-width:440px){.view-toolbar{gap:3px;padding-left:9px;padding-right:9px}.view-actions{gap:0}.view-actions button{padding:6px}.view-brand{font-size:12px}.view-count{font-size:11px}.view-selector{height:clamp(100px,17dvh,135px)}}
@media(prefers-reduced-motion:reduce){#viewer-image{transition:none}}
</style></head><body><header><a class="logo" href="#top">MEVS</a><div class="right"><a class="link" href="https://pixelfed.social/mevs" target="_blank" rel="noopener">Pixelfed ↗</a><button id="return-book" type="button" hidden>◫ Book view</button><button id="theme" aria-label="Toggle dark mode">◐ Theme</button></div></header><main id="top"><section class="intro"><div class="eyebrow">Photography / An ongoing collection</div><h1>Life, observed.</h1><p>Moments in passing. A visual journal of ordinary scenes, unexpected details, and the spaces between.</p></section><div id="demo" class="demo">Design preview — sample compositions, not your photographs</div><div class="gallery" id="gallery"><figure class="photo"><div class="sample"></div><figcaption><span>001 — An ordinary moment</span><span>Photography</span></figcaption></figure><figure class="photo"><div class="sample wide"></div><figcaption><span>002 — In passing</span><span>Photography</span></figcaption></figure><figure class="photo"><div class="sample square"></div><figcaption><span>003 — Between places</span><span>Photography</span></figcaption></figure></div></main><footer>MEVS · PHOTOGRAPHY<br><br><a href="https://pixelfed.social/mevs">Follow on Pixelfed ↗</a></footer><section class="viewer" id="viewer" aria-label="MEVS photography viewer" tabindex="-1">
<div class="view-toolbar"><span class="view-brand">MEVS</span><span id="viewer-count" class="view-count">—</span><div class="view-actions"><button id="viewer-random" title="Random photograph">⤨ Random</button><button id="viewer-close" title="Continuous scroll">☰ Scroll</button><button id="view-settings-toggle" class="icon-btn" title="Viewer settings" aria-expanded="false">⚙</button><button id="viewer-full" class="icon-btn" title="Fullscreen">⛶</button></div></div>
<div id="view-settings" class="view-settings"><button id="viewer-theme">◐ Light background</button><button id="fit-toggle">⛶ Fit entire image</button><button id="viewer-shuffle">⇄ Shuffle thumbnails</button><label>Thumbnail size <input id="thumb-size" type="range" min="52" max="160" value="78"></label></div>
<div class="view-area" id="view-area"><img id="viewer-image" alt=""><button id="viewer-prev" class="view-arrow prev" aria-label="Previous photograph">‹</button><button id="viewer-next" class="view-arrow next" aria-label="Next photograph">›</button></div>
<button id="viewer-strip-toggle" class="selector-toggle" aria-controls="view-selector" aria-expanded="true"><span class="toggle-label"><span class="chevron">⌄</span><span id="selector-label">Hide photos</span></span></button>
<div class="view-selector" id="view-selector"><div class="view-film" id="viewer-film" aria-label="Choose photograph"></div></div>
</section><script>
const themeButton=document.getElementById('theme');function theme(d){document.body.classList.toggle('dark',d);themeButton.textContent=d?'☀ Light':'◐ Dark';try{localStorage.setItem('mevs-theme',d?'dark':'light')}catch(e){}}theme((()=>{try{return localStorage.getItem('mevs-theme')!=='light'}catch(e){return true}})());themeButton.onclick=()=>theme(!document.body.classList.contains('dark'));
const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),viewerImage=document.getElementById('viewer-image'),counter=document.getElementById('viewer-count'),film=document.getElementById('viewer-film'),settings=document.getElementById('view-settings');
let photos=[],current=0,shuffled=false,previousFocus=null,transitionTimer=null;
function render(items){photos=items;gallery.replaceChildren();items.forEach((p,i)=>{let fig=document.createElement('figure');fig.className='photo';let a=document.createElement('a');a.href=p.post_url||'https://pixelfed.social/mevs';a.addEventListener('click',e=>{e.preventDefault();openViewer(i)});let img=document.createElement('img');img.src=p.image;img.alt=p.alt||'Photograph by MEVS';img.loading=i<2?'eager':'lazy';a.append(img);let cap=document.createElement('figcaption');cap.textContent=String(items.length-i).padStart(3,'0')+(p.caption?' — '+p.caption:'');fig.append(a,cap);gallery.append(fig)});document.getElementById('demo').hidden=true;buildSelector();openViewer(0)}
function buildSelector(){film.replaceChildren();let order=photos.map((_,i)=>i);if(shuffled){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}order.forEach(i=>{let b=document.createElement('button');b.dataset.index=i;b.type='button';b.setAttribute('aria-label','Photo '+(photos.length-i));let im=document.createElement('img');im.src=photos[i].image;im.alt='';im.loading='lazy';let n=document.createElement('small');n.textContent=photos.length-i;b.append(im,n);b.onclick=()=>showPhoto(i);film.append(b)});updateSelection()}
function updateSelection(){film.querySelectorAll('button').forEach(b=>{let on=Number(b.dataset.index)===current;b.classList.toggle('selected',on);b.setAttribute('aria-current',String(on))})}
function centerSelection(){film.querySelector('button.selected')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function showPhoto(n){if(!photos.length)return;let old=current;current=(n+photos.length)%photos.length;let p=photos[current];clearTimeout(transitionTimer);viewerImage.classList.remove('changing');viewerImage.src=p.image;viewerImage.alt=p.alt||'Photograph by MEVS';counter.textContent=String(photos.length-current).padStart(2,'0')+' / '+photos.length;updateSelection();if(!viewer.classList.contains('selector-hidden'))centerSelection();if(viewer.classList.contains('open')&&old!==current&&!matchMedia('(prefers-reduced-motion:reduce)').matches){viewerImage.style.setProperty('--shift',(n>old?'14px':'-14px'));viewerImage.classList.add('changing');transitionTimer=setTimeout(()=>viewerImage.classList.remove('changing'),165)}}
function openViewer(n){previousFocus=document.activeElement;viewer.classList.add('open');document.body.classList.add('book-active');document.getElementById('return-book').hidden=true;showPhoto(n);viewer.focus()}
function closeViewer(){viewer.classList.remove('open');settings.classList.remove('open');document.body.classList.remove('book-active');document.getElementById('return-book').hidden=false;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});window.scrollTo({top:0,behavior:'instant'});previousFocus?.focus()}
document.getElementById('return-book').textContent='▣ Gallery view';document.getElementById('return-book').onclick=()=>openViewer(current);document.getElementById('viewer-close').onclick=closeViewer;
document.getElementById('viewer-prev').onclick=()=>showPhoto(current-1);document.getElementById('viewer-next').onclick=()=>showPhoto(current+1);
document.getElementById('viewer-random').onclick=()=>{if(photos.length<2)return;let n=Math.floor(Math.random()*(photos.length-1));if(n>=current)n++;showPhoto(n)};
document.getElementById('viewer-strip-toggle').onclick=e=>{let hidden=viewer.classList.toggle('selector-hidden');document.getElementById('selector-label').textContent=hidden?'Show photos':'Hide photos';e.currentTarget.setAttribute('aria-expanded',String(!hidden));if(!hidden)centerSelection()};
document.getElementById('view-settings-toggle').onclick=e=>{let opened=settings.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(opened))};
document.getElementById('viewer-shuffle').onclick=e=>{shuffled=!shuffled;e.currentTarget.textContent=shuffled?'↕ Restore order':'⇄ Shuffle thumbnails';buildSelector();centerSelection()};
document.getElementById('thumb-size').oninput=e=>viewer.style.setProperty('--thumb',e.target.value+'px');
function saved(k){try{return localStorage.getItem(k)}catch(e){return null}}function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let light=saved('mevs-view-bg')==='light';function setViewerTheme(v){light=v;viewer.classList.toggle('light-view',v);document.getElementById('viewer-theme').textContent=v?'◐ Dark background':'◐ Light background';save('mevs-view-bg',v?'light':'dark')}setViewerTheme(light);document.getElementById('viewer-theme').onclick=()=>setViewerTheme(!light);
let fill=saved('mevs-fit')==='fill';function setFit(v){fill=v;viewer.classList.toggle('fill-image',v);document.getElementById('fit-toggle').textContent=v?'▣ Fill (cropped)':'⛶ Fit entire image';save('mevs-fit',v?'fill':'fit')}setFit(fill);document.getElementById('fit-toggle').onclick=()=>setFit(!fill);
document.getElementById('viewer-full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(viewer.requestFullscreen)await viewer.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape'){if(settings.classList.contains('open'))settings.classList.remove('open');else closeViewer()}if(e.key==='ArrowLeft')showPhoto(current-1);if(e.key==='ArrowRight')showPhoto(current+1)});
let x=0,y=0;const area=document.getElementById('view-area');area.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});area.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)showPhoto(current+(dx<0?1:-1))},{passive:true});
fetch('./photos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No photos yet');return r.json()}).then(data=>{if(Array.isArray(data)&&data.length)render(data)}).catch(()=>{});
</script></body></html>
